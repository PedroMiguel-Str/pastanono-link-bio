<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4ECDB">
<meta name="description" content="Bistrô Pasta Nono, cucina italiana em Campo Bom. Peça, reserve e chegue até a mesa do nono.">
<title>Bistrô Pasta Nono · Cucina Italiana</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root{
    /* Paleta oficial da marca */
    --crema:#F4ECDB; --panna:#FBF7EE; --crema-deep:#E8DCC4; --linha:#D9CCB2;
    --nero:#141210; --verde:#2E7D4F; --verde-deep:#1E5C39;
    --rosso:#C2362B; --rosso-deep:#9A271F;
    --oro:#C8A24C; --oro-deep:#A07F32; --oro-soft:#E4CF95; --vino:#6B2434;
    /* derivadas */
    --ink-soft:rgba(20,18,16,.74);
    --ink-faint:rgba(20,18,16,.40);
    --sepia:#9A7B55;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    min-height:100dvh;
    font-family:'Montserrat',system-ui,sans-serif;
    color:var(--nero);
    background-color:var(--crema-deep);
    background-image:
      radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.30), transparent 55%),
      radial-gradient(140% 120% at 50% 100%, rgba(70,45,20,.10), transparent 60%),
      repeating-linear-gradient(0deg, rgba(60,40,20,.015) 0 1px, transparent 1px 4px);
    display:flex;
    justify-content:center;
    align-items:stretch;
    padding:
      max(14px, env(safe-area-inset-top))
      max(14px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom))
      max(14px, env(safe-area-inset-left));
  }

  /* ---------- Moldura dupla bordô com fundo pergaminho ---------- */
  .frame{
    position:relative;
    width:100%;
    max-width:460px;
    align-self:stretch;
    border:1.4px solid var(--rosso);
    border-radius:3px;
    background:
      radial-gradient(130% 80% at 50% 8%, var(--panna), var(--crema) 62%, #efe4cd 100%);
    box-shadow:
      inset 0 0 0 0.5px rgba(154,39,31,.25),
      inset 0 0 70px rgba(80,50,22,.10),
      inset 0 0 22px rgba(80,50,22,.06),
      0 18px 40px rgba(40,26,12,.16);
    overflow:hidden;
    isolation:isolate;
  }
  /* filete interno (a segunda linha da moldura dupla) */
  .frame::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(154,39,31,.50);
    border-radius:2px;
    pointer-events:none;
    z-index:3;
  }
  /* vinheta suave nas bordas internas */
  .frame::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(115% 90% at 50% 42%, transparent 60%, rgba(60,38,16,.10) 100%);
    pointer-events:none;
    z-index:2;
  }

  /* ---------- Florões dourados nos cantos ---------- */
  .corner{
    position:absolute;
    width:34px;height:34px;
    stroke:var(--oro-deep);
    fill:none;
    stroke-width:1.3;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:.62;
    z-index:4;
    pointer-events:none;
  }
  .corner.tl{top:11px;left:11px}
  .corner.tr{top:11px;right:11px;transform:scaleX(-1)}
  .corner.bl{bottom:11px;left:11px;transform:scaleY(-1)}
  .corner.br{bottom:11px;right:11px;transform:scale(-1,-1)}

  /* ---------- Vila toscana: gravura real no canto superior direito (fiel ao carrossel) ---------- */
  .vila{
    position:absolute;
    top:10px; right:12px;
    width:118px; height:auto;
    opacity:.46;
    z-index:1;
    pointer-events:none;
    mix-blend-mode:multiply;
  }

  /* ---------- Conteúdo ---------- */
  .content{
    position:relative;
    z-index:5;
    padding:34px 30px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
  }
  @media (min-height:720px){ .content{padding-top:40px} }

  /* ---------- Cabeçalho ---------- */
  header{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .logo{
    width:200px;
    max-width:70%;
    height:auto;
    display:block;
  }
  .eyebrow{
    margin:26px 0 12px;
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:.42em;
    text-indent:.42em;
    color:var(--oro-deep);
    text-transform:uppercase;
  }
  .tagline{
    margin:0;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(27px, 8.2vw, 33px);
    line-height:1.22;
    color:var(--rosso-deep);
    max-width:18ch;
  }
  .tagline .verde{ color:var(--verde-deep) }

  /* ---------- Florão divisor ---------- */
  .floron{
    width:150px;height:22px;
    margin:16px 0 18px;
    stroke:var(--oro-deep);
    fill:none;
    stroke-width:1.3;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:.9;
  }
  .floron .leaf{ fill:var(--oro-soft); stroke:var(--oro-deep) }
  .floron .dot{ fill:var(--oro-deep); stroke:none }

  /* ---------- Botões pílula ---------- */
  nav.links{
    width:100%;
    max-width:352px;
    display:flex;
    flex-direction:column;
    gap:11px;
  }

  .pill{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    min-height:55px;
    padding:0 16px 0 18px;
    border-radius:40px;
    text-decoration:none;
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.012em;
    color:var(--panna);
    background:linear-gradient(176deg, #2f7b50 0%, var(--verde-deep) 58%, #184d30 100%);
    box-shadow:
      inset 0 0 0 1px rgba(228,207,149,.34),
      inset 0 1px 0 rgba(255,255,255,.12),
      0 6px 16px rgba(24,58,38,.24);
    transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .pill-primary{
    box-shadow:
      inset 0 0 0 2px var(--oro-soft),
      inset 0 1px 0 rgba(255,255,255,.16),
      0 7px 18px rgba(24,58,38,.30);
  }
  .pill-ico{
    flex:0 0 auto;
    width:26px;height:26px;
    display:grid;place-items:center;
    color:var(--panna);
  }
  .ico{
    fill:none;
    stroke:currentColor;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .pill-ico .ico{ width:23px;height:23px }
  .pill-label{ flex:1 1 auto; text-align:left }
  .pill-orn{
    flex:0 0 auto;
    width:15px;height:16px;
    stroke:var(--oro-soft);
    fill:none;
    stroke-width:1.2;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:.82;
  }

  .pill:hover{
    filter:brightness(1.05);
    box-shadow:
      inset 0 0 0 1px rgba(228,207,149,.55),
      inset 0 1px 0 rgba(255,255,255,.14),
      0 9px 20px rgba(24,58,38,.30);
  }
  .pill:active{
    transform:translateY(1px);
    background:linear-gradient(176deg, #276b45 0%, #184d30 60%, #123b25 100%);
    box-shadow:
      inset 0 0 0 1px rgba(228,207,149,.40),
      inset 0 2px 5px rgba(0,0,0,.22);
  }
  .pill:focus-visible{
    outline:2px solid var(--oro);
    outline-offset:3px;
  }

  /* ---------- Botão desabilitado (Cardápio) ---------- */
  .pill-off{
    border:none;
    cursor:default;
    color:var(--ink-faint);
    background:linear-gradient(176deg, #efe6d1, var(--crema-deep));
    box-shadow:inset 0 0 0 1px var(--linha);
    font-family:'Montserrat',sans-serif;
  }
  .pill-off .pill-ico{ color:var(--ink-faint) }
  .pill-off .badge{
    flex:0 0 auto;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--vino);
    background:rgba(107,36,52,.10);
    border:1px solid rgba(107,36,52,.22);
    padding:5px 9px;
    border-radius:20px;
  }

  /* ---------- Rodapé ---------- */
  footer{
    margin-top:auto;
    padding-top:34px;
    width:100%;
    max-width:352px;
    text-align:center;
    color:var(--ink-soft);
  }
  .footer-rule{
    width:66px;height:1px;
    margin:0 auto 12px;
    background:linear-gradient(90deg, transparent, var(--oro-deep), transparent);
    opacity:.65;
  }
  footer address{
    font-style:normal;
    font-size:11.5px;
    font-weight:400;
    line-height:1.7;
    letter-spacing:.02em;
  }
  footer .hours{
    margin:9px 0 0;
    font-size:11px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--verde-deep);
  }
  footer .handle{
    display:inline-block;
    margin-top:13px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--verde-deep);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .16s ease;
  }
  footer .handle:hover{ border-bottom-color:rgba(30,92,57,.5) }
  footer .handle:focus-visible{ outline:2px solid var(--oro); outline-offset:3px; border-radius:2px }

  /* ---------- Entrada suave ---------- */
  @media (prefers-reduced-motion:no-preference){
    .content > * , nav.links .pill{
      animation:rise .6s cubic-bezier(.2,.7,.2,1) both;
    }
    header{ animation-delay:.02s }
    .floron{ animation-delay:.10s }
    nav.links .pill:nth-child(1){ animation-delay:.14s }
    nav.links .pill:nth-child(2){ animation-delay:.20s }
    nav.links .pill:nth-child(3){ animation-delay:.26s }
    nav.links .pill:nth-child(4){ animation-delay:.32s }
    nav.links .pill:nth-child(5){ animation-delay:.38s }
    footer{ animation-delay:.44s }
    @keyframes rise{
      from{opacity:0; transform:translateY(10px)}
      to{opacity:1; transform:translateY(0)}
    }
  }

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<!-- ================= SPRITE SVG (self-contained, sem CDN) ================= -->

<main class="frame">
